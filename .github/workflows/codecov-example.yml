name: Codecov Example

on:
  pull_request:
    paths:
      - ".github/workflows/codecov-example.yml"
      - "examples/codecov-demo/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Test And Upload Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: examples/codecov-demo/package-lock.json

      - name: Install dependencies
        working-directory: examples/codecov-demo
        run: npm ci

      - name: Run tests with coverage
        working-directory: examples/codecov-demo
        run: npm test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./examples/codecov-demo/coverage/cobertura-coverage.xml
          flags: codecov-demo
          name: codecov-demo-report
          fail_ci_if_error: true
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
